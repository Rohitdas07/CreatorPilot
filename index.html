<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreatorPilot AI – Autonomous Creator Assistant</title>
    <meta
      name="description"
      content="Convert one piece of content into Instagram Reels, YouTube Shorts, captions, trending hashtags, and platform-specific social media posts."
    />
    <meta property="og:title" content="CreatorPilot AI – Autonomous Creator Assistant" />
    <meta
      property="og:description"
      content="Create once. Publish everywhere. Transform scripts, transcripts, audio, or video into multi-platform social content."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('creatorpilot_theme_mode') || 'system';
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          root.dataset.theme = isDark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
